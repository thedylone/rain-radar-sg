name: Tests

# Runs the unit tests and checks the Paparazzi screenshots. Needs no secrets,
# so it also runs on pull requests from forks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # verifyPaparazziDebug runs every debug unit test, with screenshot tests
      # failing when the UI no longer matches app/src/test/snapshots.
      - name: Run tests
        run: ./gradlew verifyPaparazziDebug --no-daemon

      - name: Upload test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/paparazzi/failures/
          if-no-files-found: ignore
